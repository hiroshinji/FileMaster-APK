name: Build FileMaster APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Extrair projeto Android
        run: unzip -o CapivaRAR-v0.10.2.zip

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Instalar componentes Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: cd filemaster && gradle assembleDebug

      - name: Disponibilizar APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: FileMaster-debug-apk
          path: filemaster/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
